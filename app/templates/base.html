<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}پنل{% endblock %} · Hashbot</title>
<style>
:root{--bg:#f4f3ef;--fg:#1d1d1b;--card:#fff;--bd:#dcdad2;--ac:#1f5f4a;--err:#a4282b;--mut:#6b6a63}
@media(prefers-color-scheme:dark){:root{--bg:#161715;--fg:#ecebe5;--card:#20221f;--bd:#34372f;--ac:#5fc29c;--err:#ef7b7e;--mut:#9a998f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 Tahoma,"Segoe UI",sans-serif}
nav{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
nav a{color:var(--fg);text-decoration:none;padding:2px 0}nav a:hover{color:var(--ac)}nav form{margin-inline-start:auto}
main{max-width:1000px;margin:0 auto;padding:18px 14px}h1{font-size:20px;margin:0 0 14px}h2{font-size:16px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:start;vertical-align:top}
th{color:var(--mut);font-weight:600}code{direction:ltr;unicode-bidi:embed;word-break:break-all;font-size:12.5px}
input,select,button{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
button{background:var(--ac);color:var(--bg);border-color:var(--ac);cursor:pointer}button.s{background:none;color:var(--fg);border-color:var(--bd)}button.d{background:none;color:var(--err);border-color:var(--err)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row input{flex:1 1 150px}
.flash{padding:8px 12px;border-radius:6px;margin-bottom:10px;border:1px solid var(--bd)}.flash.ok{color:var(--ac)}.flash.err{color:var(--err)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.stats b{display:block;font-size:19px}.mut{color:var(--mut)}.pos{color:var(--ac)}.neg{color:var(--err)}
</style></head><body>
{% if session.admin %}<nav>
<a href="{{ url_for('dashboard') }}">داشبورد</a><a href="{{ url_for('transactions') }}">تراکنش‌ها</a>
<a href="{{ url_for('reminders') }}">یادآوری‌ها</a><a href="{{ url_for('reports') }}">گزارش‌ها</a>
<a href="{{ url_for('users') }}">کاربران</a><a href="{{ url_for('logs') }}">لاگ‌ها</a>
<a href="{{ url_for('backup') }}">بکاپ</a><a href="{{ url_for('settings') }}">تنظیمات</a>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="s">خروج ({{ session.admin }})</button></form></nav>{% endif %}
<main>{% for c, m in get_flashed_messages(with_categories=true) %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}</main></body></html>
